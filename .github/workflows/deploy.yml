name: Costruisci il sito

# A ogni modifica dei contenuti (e ogni notte) genera le pagine HTML
# e le pubblica sul ramo "deploy", che Hostinger importa in public_html.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"   # ogni notte (UTC): rende visibile il commento del nuovo giorno

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python3 build.py
      - name: Pubblica sul ramo deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: deploy
          force_orphan: true
